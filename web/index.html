<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rastreador</title>
  <link rel="icon" href="data:,">
  <!-- Orden: primero los tokens (variables); el tema de estilo elegido (V-10) se inserta justo después
       (js/temas.js) y redefine esas mismas variables; después va lo que las usa. -->
  <link rel="stylesheet" href="css/tokens.css" id="tokens">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/selector-periodo.css">
  <link rel="stylesheet" href="css/linea-tiempo.css">
  <link rel="stylesheet" href="css/vistas/comun.css">
</head>
<body>
  <a class="saltar" href="#vista" onclick="event.preventDefault(); document.getElementById('vista').focus();">Saltar al contenido</a>
  <div class="marco">
    <!-- Menú lateral (V-11): cada enlace cambia solo el "#" de la dirección; el router (js/router.js) muestra la vista. -->
    <aside class="lateral">
      <a class="marca" href="#/hoy" aria-label="Rastreador: ir a Hoy">
        <svg class="marca-icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>Rastreador</span>
      </a>
      <nav class="menu" aria-label="Vistas">
        <p class="menu-grupo">Día</p>
        <a href="#/hoy"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy</a>
        <a href="#/horas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M9 20V4M14 20v-7M19 20v-11"/></svg>Horas del día</a>
        <p class="menu-grupo">Períodos</p>
        <a href="#/resumen"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Resumen</a>
        <a href="#/tipico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3l2-6 4 12 3-9 2 3h4"/></svg>Día típico</a>
        <a href="#/comparar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/></svg>Comparar</a>
        <a href="#/explorador"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Explorador</a>
        <p class="menu-grupo">Plan</p>
        <a href="#/horario"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Horario</a>
        <a href="#/cumplimiento"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Cumplimiento</a>
        <a href="#/simulador"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6l-8-3Z"/></svg>Simulador</a>
        <p class="menu-grupo">Datos</p>
        <a href="#/clasificacion"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9-9-9Z"/><circle cx="8" cy="8" r="1.5"/></svg>Clasificación</a>
        <a href="#/diario"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z"/><path d="M9 8h6M9 12h6"/></svg>Diario</a>
        <a href="#/ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ajustes</a>
      </nav>
      <div class="lateral-pie">
        <!-- Estado de ActivityWatch (js/app.js lo revisa cada 30 s). -->
        <p id="estado-aw" class="estado-aw" data-estado="revisando"><span class="estado-aw-punto" aria-hidden="true"></span><span class="estado-aw-texto">Revisando AW…</span></p>
        <!-- Reloj de prueba (H-02): solo aparece con ?ahora= en la dirección. -->
        <p id="reloj-prueba" class="reloj-prueba" hidden></p>
        <button id="boton-tema" class="boton boton-fantasma" type="button">Tema</button>
      </div>
    </aside>

    <div class="contenido">
      <!-- Aviso si ActivityWatch no responde (lo muestra js/app.js). -->
      <p id="aviso-aw" class="aviso aviso-global" role="alert" hidden></p>
      <!-- Aquí el router dibuja la vista actual. -->
      <main id="vista" class="vista" tabindex="-1"></main>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
